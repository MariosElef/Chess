[workspace]
resolver = "3"
members = ["backend", "crates/chess-domain", "desktop"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.clippy]
float_arithmetic = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
overflow-checks = true

# The chess rules run on every frame; unoptimised, they drop frames.
[profile.dev]
opt-level = 1

# GPUI and everything it draws with render slowly unoptimised, so every dependency is optimised
# even in debug builds; the workspace's own crates stay quick to compile.
[profile.dev.package."*"]
opt-level = 3
