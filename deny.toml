# cargo-deny policy, from stackup.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Flag abandoned crates we depend on directly; ones deep in GPUI or sqlx are theirs to replace.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # File-level copyleft, fine for unmodified crates; GPUI needs cbindgen, dwrote and option-ext.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
