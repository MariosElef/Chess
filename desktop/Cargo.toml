[package]
name = "chess-desktop"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chess-domain = { version = "0.1.5", path = "../crates/chess-domain" }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
# Live games over `wss://` once the server is behind HTTPS, trusting the system's certificates.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# The Dock's icon is set through AppKit, as the app runs unbundled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

# Puts the app's icon into Chess.exe; used only when building for Windows.
[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
gpui-kit = { version = "0.9.0", features = ["gpui-fast", "test-support"] }
serde-saphyr = "1.3.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
