[package]
name = "chess-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chess-domain = { version = "0.1.0", path = "../crates/chess-domain" }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
gpui-kit = { version = "0.9.0", features = ["gpui-fast", "test-support"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
