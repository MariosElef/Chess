id: no-gpui-below-components
valid:
  - "use chess_domain::Board;"
  - 'const S: &str = "gpui_kit::App";'
  - "// gpui_kit::App in a comment"
invalid:
  - "use gpui_kit::App;"
  - "use gpui_kit::*;"
  - "gpui_kit::actions!(history, [Back]);"
  - "fn f(cx: &mut gpui_kit::App) {}"
---
id: clients-no-ui
valid:
  - "use gpui_kit::base::async_util::{Receiver, Sender, unbounded};"
  - "fn f(r: gpui_kit::base::async_util::Receiver<u8>) {}"
invalid:
  - "use gpui_kit::{App, Window};"
  - "use gpui_kit::*;"
  - "fn f(w: &gpui_kit::Window) {}"
---
id: no-reaching-up
valid:
  - "use super::board_colors::BoardColors;"
  - "use crate::models::engine::EngineSettings;"
invalid:
  - "use super::super::history::GameHistory;"
  - "fn f() { super::super::thing(); }"
