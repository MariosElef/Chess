# Builds the app for macOS, Windows and Linux when a version tag is pushed (`git tag v0.2.0 &&
# git push origin v0.2.0`), each with the server's address built in and Stockfish beside it, and
# attaches them to a GitHub release: a .dmg for macOS, a setup program for Windows, a tarball for
# Linux. The address is the repository variable CHESS_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHESS_SERVER_URL: ${{ vars.CHESS_SERVER_URL }}
  STOCKFISH_RELEASE: sf_19

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Chess.app and its .dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --release -p chess-desktop
      - name: Put the app and Stockfish in one folder
        run: |
          mkdir -p dist/Chess
          cp target/release/chess-desktop.exe dist/Chess/Chess.exe
          curl -fsSL -o stockfish.zip "https://github.com/official-stockfish/Stockfish/releases/download/$STOCKFISH_RELEASE/stockfish-windows-x86-64-universal.zip"
          unzip -q stockfish.zip -d stockfish
          cp stockfish/stockfish/stockfish-windows-x86-64-universal.exe dist/Chess/stockfish.exe
          cp stockfish/stockfish/Copying.txt dist/Chess/Stockfish-COPYING.txt
      # One setup program to download, rather than a folder with two programs in it.
      - name: Make the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" scripts\windows-installer.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*-windows-x64-setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # gpui-component's own list (script/install-linux.sh), without the web view's WebKit and the
      # OpenSSL and zstd this app does not use. Built on 22.04 so it runs on older systems too.
      - name: GPUI's and the sound's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libasound2-dev libvulkan1
      - name: Build
        run: cargo build --release -p chess-desktop
      - name: Put the app and Stockfish in one folder
        run: |
          mkdir -p dist/Chess
          cp target/release/chess-desktop dist/Chess/chess
          curl -fsSL -o stockfish.tar.gz "https://github.com/official-stockfish/Stockfish/releases/download/$STOCKFISH_RELEASE/stockfish-linux-x86-64-universal.tar.gz"
          tar -xzf stockfish.tar.gz
          cp stockfish/stockfish-linux-x86-64-universal dist/Chess/stockfish
          cp stockfish/Copying.txt dist/Chess/Stockfish-COPYING.txt
          chmod +x dist/Chess/chess dist/Chess/stockfish
          tar -czf dist/Chess-linux-x64.tar.gz -C dist Chess
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Chess-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
