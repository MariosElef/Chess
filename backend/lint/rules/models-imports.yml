id: models-imports
language: Rust
severity: error
message: "A model is plain data: it reaches no other layer and no configuration."
note: Imports point downward only — routes → services → repositories and clients → models.
files: ['**/src/models/**', '**/src/models.rs']
rule:
  any:
    - kind: use_declaration
      regex: '\bcrate::(\{[^;]*\b)?(services|routes|repositories|clients|config)\b'
    - matches: outer-path
      regex: '^crate::(services|routes|repositories|clients|config)\b'
