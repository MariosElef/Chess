id: no-reaching-up
language: Rust
severity: error
message: "`super::super::` reaches another layer past every import rule: name it from `crate::`."
files:
  - '**/src/routes/**'
  - '**/src/services/**'
  - '**/src/repositories/**'
  - '**/src/models/**'
  - '**/src/extract/**'
  - '**/src/errors/**'
rule:
  any:
    - kind: use_declaration
      regex: '\bsuper::super\b'
    - matches: outer-path
      regex: '^super::super\b'
